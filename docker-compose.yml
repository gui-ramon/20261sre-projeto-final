services:
  # MinIO: Storage de Objetos (Simulando S3)
  minio:
    image: minio/minio
    container_name: olist_minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "00000000"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Dagster: Orquestrador e Monitoramento SRE
  dagster:
    image: python:3.9-slim
    container_name: olist_dagster
    volumes:
      - .:/opt/dagster/app
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=00000000
    working_dir: /opt/dagster/app
    command: /bin/bash -c "pip install dagster dagit dagster-duckdb dagster-dbt boto3 pandas duckdb && dagster dev -h 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    depends_on:
      minio:
        condition: service_healthy

  # Grafana: Visualização dos Resultados
  grafana:
    image: grafana/grafana:latest
    container_name: olist_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=00000000
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  minio_data:
  grafana_data:
